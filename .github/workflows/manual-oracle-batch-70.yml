name: Manual oracle batch 70

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-70.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  explicit-acceptance-test-boundary:
    name: Explicit acceptance-test section oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real Zoho provisioning oracle
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo sprintberlin/openclaw-cliq \
            --issue 94 \
            --pr 153 \
            --policy report-only \
            --format json \
            --output dogfood-results/openclaw-cliq-153.json

      - name: Compare with independent acceptance-test oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(
            readFileSync('dogfood-results/openclaw-cliq-153.json', 'utf8')
          ).report;

          // Independent inspection of sprintberlin/openclaw-cliq issue #94 and merged PR #153:
          // - the issue contains eight checkbox acceptance criteria;
          // - immediately after them it has an explicit `## Franzi acceptance test` section;
          // - that section requires a real-organization dry-run/read-back verification and says
          //   mutation testing should use an isolated test bot;
          // - PR #153 explicitly says live acceptance against a real organization remains a
          //   human step tracked in ROADMAP;
          // - exact PR head 0f60c1c15c6f851691474ef17bd4263bd6538888 has green typecheck/test/build
          //   and compatibility smoke checks, but none is direct evidence that the Franzi/live
          //   organization acceptance test actually ran.
          // Therefore the explicit acceptance-test section is part of the issue's definition of
          // done and must not disappear merely because it is prose rather than a checkbox.

          if (report.results.length !== 9) {
            throw new Error(`Expected 8 checkbox criteria plus 1 explicit Franzi acceptance-test requirement, received ${report.results.length}.`);
          }

          const liveCriterion = report.results.find((result) =>
            /Franzi|real organization|dry-run.*handler|read-back verification/i.test(result.requirement.text)
          );

          if (!liveCriterion) {
            throw new Error('Expected the explicit Franzi acceptance-test section to be extracted as an authoritative requirement.');
          }

          if (liveCriterion.status === 'PROVEN') {
            throw new Error('Green source CI must not PROVE the required real-organization Franzi acceptance test without direct live evidence.');
          }

          if (report.verdict === 'PROVEN') {
            throw new Error('Overall verdict must not be PROVEN while the explicit live acceptance test remains without direct evidence.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            criteria: report.results.map((result) => ({
              text: result.requirement.text,
              status: result.status,
              reason: result.reason
            })),
            checks: report.checks.map((check) => ({
              name: check.name,
              scope: check.scope,
              status: check.status,
              conclusion: check.conclusion
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-70
          path: dogfood-results/openclaw-cliq-153.json
          if-no-files-found: error
