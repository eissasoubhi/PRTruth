name: Manual oracle batch 49

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-49.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  packaged-runtime:
    name: Packaged runtime evidence oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real packaged-runtime recovery history
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo Chasen-Liao/pi-agent-desktop \
            --issue 14 \
            --pr 15 \
            --policy report-only \
            --format json \
            --output dogfood-results/pi-agent-desktop-15.json

      - name: Compare with independent packaged-runtime oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('dogfood-results/pi-agent-desktop-15.json', 'utf8')).report;

          if (report.results.length !== 6) {
            throw new Error(`Expected exactly 6 authoritative acceptance criteria, received ${report.results.length}.`);
          }

          const runtimeFile = report.results.find((result) => /standalone output contains.*pi-ai.*dist\/index\.js/i.test(result.requirement.text));
          const health = report.results.find((result) => /packaged.*api\/health.*200/i.test(result.requirement.text));
          const sessions = report.results.find((result) => /packaged.*api\/sessions.*200/i.test(result.requirement.text));
          const providers = report.results.find((result) => /packaged.*api\/auth\/providers.*200/i.test(result.requirement.text));
          const buildFails = report.results.find((result) => /build automatically fails/i.test(result.requirement.text));
          const installed = report.results.find((result) => /win-unpacked.*NSIS-installed.*v0\.8\.1/i.test(result.requirement.text));

          if (!runtimeFile || !health || !sessions || !providers || !buildFails || !installed) {
            throw new Error('Expected all six packaged-runtime acceptance criteria to be extracted.');
          }

          // Independent inspection of PR #15's exact head c32abc36... shows one
          // successful CI run with three jobs: Windows tests, lint/typecheck/test,
          // and a Next.js standalone build. The build command itself includes the
          // isolated standalone smoke, so that is meaningful evidence for the
          // standalone artifact/runtime path. But this exact PR-head CI does not
          // contain an Electron packaging job or an NSIS-install execution lane.
          // PR-body prose reports those manual validations, but prose must not be
          // promoted into authoritative packaged-runtime execution evidence.
          if (installed.status === 'PROVEN') {
            throw new Error('The NSIS-installed acceptance criterion must not be PROVEN without observable exact-head installer execution evidence.');
          }

          for (const result of [health, sessions, providers]) {
            if (result.status === 'PROVEN' && !result.evidence.some((item) => /standalone|build next\.js|smoke/i.test(item.summary))) {
              throw new Error(`Packaged HTTP behavior must not be PROVEN from unrelated CI: ${result.requirement.text}`);
            }
          }

          if (report.verdict === 'PROVEN' && installed.status !== 'PROVEN') {
            throw new Error('Overall verdict cannot be PROVEN while the explicit installed-package criterion lacks direct evidence.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            criteria: report.results.map((result) => ({
              text: result.requirement.text,
              status: result.status,
              reason: result.reason
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-49
          path: dogfood-results/pi-agent-desktop-15.json
          if-no-files-found: error
