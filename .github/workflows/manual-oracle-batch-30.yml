name: Manual oracle batch 30

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-30.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-30.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run split-delivery browser oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo nexu-io/open-design \
            --issue 6916 \
            --pr 7087 \
            --policy report-only \
            --format json \
            --output oracle-results/open-design-6916-7087.json
      - name: Assert split-delivery stays conservative
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/open-design-6916-7087.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
            console.log(JSON.stringify({ reason: result.reason, evidence: result.evidence }, null, 2));
          }

          if (results.length !== 4) {
            throw new Error(`Expected exactly 4 acceptance criteria from issue #6916, observed ${results.length}`);
          }

          const browserWitness = results.find((r) => /browser regression test covers the viewport-edge case/i.test(r.requirement?.text ?? ''));
          if (!browserWitness) throw new Error('Missing browser-regression acceptance criterion');

          // PR #7087 is a test-only follow-up. The production placement behavior
          // was already shipped by PR #6971, while #7087 adds the missing grid
          // browser witness. A target-PR verifier must not attribute pre-existing
          // behavior to this candidate merely because the issue groups all four
          // criteria together.
          if (report.verdict === 'PROVEN') {
            throw new Error('Split delivery across an earlier fix and this follow-up must not become globally PROVEN');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-30
          path: oracle-results/*.json
