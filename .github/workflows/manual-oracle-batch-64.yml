name: Manual oracle batch 64

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-64.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  benchmark-evidence-boundary:
    name: Benchmark evidence boundary oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real benchmark-history oracle
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo pyjanitor-devs/janitor-rs \
            --issue 101 \
            --pr 108 \
            --policy report-only \
            --format json \
            --output dogfood-results/janitor-rs-108.json

      - name: Compare with independent benchmark oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(
            readFileSync('dogfood-results/janitor-rs-108.json', 'utf8')
          ).report;

          if (report.results.length !== 4) {
            throw new Error(`Expected exactly 4 acceptance criteria, received ${report.results.length}.`);
          }

          const benchmarkCriterion = report.results.find((result) =>
            /Benchmarks compare direct selection/i.test(result.requirement.text)
          );
          const correctnessCriterion = report.results.find((result) =>
            /Direct correctness tests cover/i.test(result.requirement.text)
          );

          if (!benchmarkCriterion || !correctnessCriterion) {
            throw new Error('Expected both benchmark and direct-correctness acceptance criteria to be extracted.');
          }

          // Independent inspection of pyjanitor-devs/janitor-rs issue #101, merged PR #108,
          // and exact PR head 0a6e6cfc80e1d853366e02a27929aeef84756691:
          // the PR adds benchmark code and describes small/large/very-large benchmark scenarios,
          // while its declared verification commands are cargo fmt/check/clippy and Rust unit tests.
          // The exact head exposes substantial successful CI across multiple architectures, but the
          // observable checks do not establish that the requested benchmark comparison itself ran.
          // Therefore broad build/test success or benchmark source presence must not promote the
          // benchmark acceptance criterion to PROVEN without a directly matching benchmark execution.
          if (benchmarkCriterion.status === 'PROVEN') {
            throw new Error('Broad green CI or benchmark source presence must not PROVE an unobserved benchmark-comparison execution.');
          }

          if (report.verdict === 'PROVEN') {
            throw new Error('Overall verdict must not be PROVEN while the benchmark-comparison criterion lacks direct execution evidence.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            benchmark: {
              text: benchmarkCriterion.requirement.text,
              status: benchmarkCriterion.status,
              reason: benchmarkCriterion.reason
            },
            correctness: {
              text: correctnessCriterion.requirement.text,
              status: correctnessCriterion.status,
              reason: correctnessCriterion.reason
            },
            checks: report.checks
              .filter((check) => check.scope === 'check')
              .map((check) => ({ name: check.name, status: check.status, conclusion: check.conclusion }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-64
          path: dogfood-results/janitor-rs-108.json
          if-no-files-found: error
