name: Manual oracle batch 25

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-25.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-25.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run cross-contract auth oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo FinesseStudioLab/modeltrace-contract \
            --issue 74 \
            --pr 83 \
            --policy report-only \
            --format json \
            --output oracle-results/modeltrace-74-83.json
      - name: Assert conservative review-boundary behavior
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/modeltrace-74-83.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          if (results.length !== 4) {
            throw new Error(`Expected exactly 4 acceptance criteria from issue #74, observed ${results.length}`);
          }

          const expected = [
            /Authorization tree documented per cross-contract flow/i,
            /Caller allowlists enforced in code/i,
            /Tests without `?mock_all_auths`? covering escalation attempts/i,
            /Pattern peer-reviewed and the review recorded/i,
          ];
          for (const pattern of expected) {
            if (!results.some((r) => pattern.test(r.requirement?.text ?? ''))) {
              throw new Error(`Missing expected acceptance criterion: ${pattern}`);
            }
          }

          // Independent oracle: first three are factually PROVEN by the patch,
          // focused auth tests and exact-head green CI. The fourth is FAILED:
          // the PR explicitly says it requires an independent reviewer, yet the
          // merged PR has no review submission or PR conversation comment and
          // the review-record table was intentionally left empty.
          // PRTruth may remain UNPROVEN until review/lifecycle evidence is
          // modelled deterministically; a merged PR/closed issue must never
          // imply that this original criterion was satisfied.
          const peerReview = results.find((r) => /peer-reviewed.*review recorded/i.test(r.requirement?.text ?? ''));
          if (!peerReview) throw new Error('Peer-review acceptance criterion not found');
          if (report.verdict === 'PROVEN') {
            throw new Error('Merged PR must not become globally PROVEN while independent peer-review evidence is absent');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-25
          path: oracle-results/*.json
