name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (for example v0.1.0)
        required: true
        default: v0.1.0
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    name: validate / build release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      exists: ${{ steps.existing.outputs.exists }}
      npm_exists: ${{ steps.npm.outputs.exists }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Validate manual release source
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Manual releases must run from the main branch; got ${GITHUB_REF}."
            exit 1
          fi

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            TAG="v${PACKAGE_VERSION}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Check whether release already exists
        id: existing
        uses: actions/github-script@v9
        with:
          script: |
            const tag = '${{ steps.release.outputs.tag }}';
            const { owner, repo } = context.repo;
            try {
              const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              core.info(`Release ${tag} already exists: ${release.data.html_url}`);
              core.setOutput('exists', 'true');
            } catch (error) {
              if (error.status !== 404) throw error;
              core.info(`Release ${tag} does not exist yet.`);
              core.setOutput('exists', 'false');
            }

      - name: Check whether released package version already exists on npm
        id: npm
        if: steps.existing.outputs.exists == 'true'
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"

          set +e
          LOOKUP_OUTPUT="$(npm view "${PACKAGE_SPEC}" version --json 2>&1)"
          LOOKUP_STATUS=$?
          set -e

          if [[ "${LOOKUP_STATUS}" -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_SPEC} is already published."
          elif grep -Eq 'E404|404 Not Found|is not in this registry' <<<"${LOOKUP_OUTPUT}"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_SPEC} is not published yet; npm publication recovery is required."
          else
            echo "Unable to determine whether ${PACKAGE_SPEC} already exists in the public npm registry." >&2
            printf '%s\n' "${LOOKUP_OUTPUT}" >&2
            exit "${LOOKUP_STATUS}"
          fi

      - name: Validate automatic release source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.existing.outputs.exists != 'true'
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha: context.sha,
            });
            const mergedIntoMain = response.data.filter((pull) =>
              pull.merged_at &&
              pull.base.ref === 'main' &&
              pull.merge_commit_sha === context.sha
            );

            if (mergedIntoMain.length !== 1) {
              core.setFailed(
                `Automatic release creation requires exactly one merged pull request into main for ${context.sha}; found ${mergedIntoMain.length}.`
              );
              return;
            }

            core.info(`Automatic release source verified from merged PR #${mergedIntoMain[0].number}.`);

      - name: Install dependencies
        if: steps.existing.outputs.exists != 'true'
        run: |
          rm -rf node_modules
          pnpm install --no-frozen-lockfile --prod=false --force

      - name: Validate package version matches tag
        if: steps.existing.outputs.exists != 'true'
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${{ steps.release.outputs.tag }}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${{ steps.release.outputs.tag }} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Typecheck
        if: steps.existing.outputs.exists != 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.existing.outputs.exists != 'true'
        run: pnpm test

      - name: Build
        if: steps.existing.outputs.exists != 'true'
        run: pnpm build

      - name: Validate npm package contents
        if: steps.existing.outputs.exists != 'true'
        run: npm pack --dry-run

  publish:
    name: create GitHub release
    needs: validate
    if: needs.validate.outputs.exists != 'true' || needs.validate.outputs.npm_exists != 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - name: Create tag and GitHub release
        if: needs.validate.outputs.exists != 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;

            if (!context.ref.startsWith('refs/tags/')) {
              try {
                await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` });
                core.info(`Tag ${tag} already exists.`);
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: `refs/tags/${tag}`,
                  sha: context.sha,
                });
                core.info(`Created tag ${tag} at ${context.sha}.`);
              }
            }

            const release = await github.rest.repos.createRelease({
              owner,
              repo,
              tag_name: tag,
              target_commitish: context.sha,
              name: `PRTruth ${tag}`,
              generate_release_notes: true,
              draft: false,
              prerelease: false,
            });
            core.info(`Created release ${release.data.html_url}`);

      - name: Dispatch npm publication
        if: needs.validate.outputs.npm_exists != 'true'
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            await github.rest.actions.createWorkflowDispatch({
              owner,
              repo,
              workflow_id: 'npm-publish.yml',
              ref: 'main',
              inputs: { tag },
            });
            core.info(`Dispatched npm publication for ${tag}.`);
