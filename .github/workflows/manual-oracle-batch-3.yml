name: Manual oracle batch 3

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-3.yml"
      - "src/**"
      - "test/**"
      - "docs/manual-oracle-corpus.md"

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  python-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build current PRTruth source
        run: pnpm build

      - name: Run Python public oracle cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oracle-results

          node dist/cli.js verify \
            --repo pydantic/pydantic \
            --issue 13369 \
            --pr 13391 \
            --policy report-only \
            --format json \
            --output oracle-results/pydantic-13369-13391.json

          node dist/cli.js verify \
            --repo pytest-dev/pytest \
            --issue 14864 \
            --pr 14865 \
            --policy report-only \
            --format json \
            --output oracle-results/pytest-14864-14865.json

      - name: Print compact matrix
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          for (const file of readdirSync('oracle-results').sort()) {
            const payload = JSON.parse(readFileSync(`oracle-results/${file}`, 'utf8'));
            const report = payload.report ?? payload;
            const counts = { PROVEN: 0, FAILED: 0, UNPROVEN: 0 };
            for (const result of report.results ?? []) counts[result.status] = (counts[result.status] ?? 0) + 1;
            console.log(`${file}: verdict=${report.verdict} requirements=${counts.PROVEN}/${counts.FAILED}/${counts.UNPROVEN} claims=${(report.claimResults ?? []).length}`);
            for (const result of report.results ?? []) console.log(`  ${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing requirement>'}`);
          }
          NODE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-3
          path: oracle-results/*.json
          if-no-files-found: warn
