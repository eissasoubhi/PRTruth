name: Manual oracle batch 58

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-58.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  merged-red-ci-boundary:
    name: Kora merged red-CI oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real merged red-CI history
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo OpenLedger-Foundation/Kora-Frontend \
            --issue 377 \
            --pr 498 \
            --policy report-only \
            --format json \
            --output dogfood-results/kora-498.json

      - name: Compare with independent merged red-CI oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('dogfood-results/kora-498.json', 'utf8')).report;

          if (report.results.length !== 4) {
            throw new Error(`Expected exactly 4 authoritative Acceptance Criteria, received ${report.results.length}.`);
          }

          const sharedUrl = report.results.find((result) => /Shared URL restores full filter state/i.test(result.requirement.text));
          const mobileParity = report.results.find((result) => /Mobile bottom sheet matches desktop/i.test(result.requirement.text));
          const clearAll = report.results.find((result) => /Clear-all resets URL/i.test(result.requirement.text));
          const serializationTests = report.results.find((result) => /Unit tests for serialization/i.test(result.requirement.text));

          if (!sharedUrl || !mobileParity || !clearAll || !serializationTests) {
            throw new Error('Expected all four marketplace filter acceptance criteria to be extracted.');
          }

          // Independent inspection of issue #377, merged PR #498, and exact head
          // b38b488d0ee284f644fb36bafc4272262a60a597: the PR was merged and closed
          // the issue despite exact-head failures including `test`, Playwright component tests,
          // axe-playwright, bundlesize, and Secret Scanning. Merge/closure must never override
          // contradictory exact-head execution evidence.
          if (serializationTests.status !== 'FAILED') {
            throw new Error(`Expected the explicit unit-test criterion to be FAILED from the exact-head failed test check, received ${serializationTests.status}.`);
          }

          for (const result of [sharedUrl, mobileParity, clearAll]) {
            if (result.status === 'PROVEN') {
              throw new Error(`Merged state and unrelated checks must not PROVE UI/runtime behavior: ${result.requirement.text}`);
            }
          }

          if (report.verdict === 'PROVEN') {
            throw new Error('Overall verdict must not be PROVEN for a merged PR with contradictory exact-head checks.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            criteria: report.results.map((result) => ({
              text: result.requirement.text,
              status: result.status,
              reason: result.reason
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-58
          path: dogfood-results/kora-498.json
          if-no-files-found: error
