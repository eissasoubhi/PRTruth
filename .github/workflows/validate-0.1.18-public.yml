name: Validate public 0.1.18

on:
  pull_request:
    paths:
      - ".github/workflows/validate-0.1.18-public.yml"

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Verify exact public npm package
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          EXPECTED_VERSION="0.1.18"
          PUBLISHED_VERSION="$(npm view "prtruth@${EXPECTED_VERSION}" version --silent)"
          LATEST_VERSION="$(npm view prtruth dist-tags.latest --silent)"
          test "${PUBLISHED_VERSION}" = "${EXPECTED_VERSION}"
          test "${LATEST_VERSION}" = "${EXPECTED_VERSION}"

          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEMP_DIR}"' EXIT
          cd "${TEMP_DIR}"

          CLI_VERSION="$(npx -y "prtruth@${EXPECTED_VERSION}" --version)"
          test "${CLI_VERSION}" = "${EXPECTED_VERSION}"

          HELP_OUTPUT="$(npx -y "prtruth@${EXPECTED_VERSION}" --help)"
          grep -F -- "--issue <number>" <<<"${HELP_OUTPUT}"
          grep -F -- "--pr <number>" <<<"${HELP_OUTPUT}"
          grep -F -- "--repo <owner/repo>" <<<"${HELP_OUTPUT}"
          grep -F -- "--format <format>" <<<"${HELP_OUTPUT}"
          grep -F -- "--output <path>" <<<"${HELP_OUTPUT}"
          grep -F -- "--github-summary" <<<"${HELP_OUTPUT}"
          grep -F -- "--comment" <<<"${HELP_OUTPUT}"
          grep -F -- "--policy <policy>" <<<"${HELP_OUTPUT}"
          grep -F -- "--color <mode>" <<<"${HELP_OUTPUT}"

          mkdir -p reports
          npx -y "prtruth@${EXPECTED_VERSION}" verify \
            --repo azholdaspaev/netty-loom-spring \
            --issue 31 \
            --pr 176 \
            --policy report-only \
            --format json \
            --output reports/netty-loom.json

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('reports/netty-loom.json', 'utf8'));
          const report = payload.report ?? payload;
          const quantified = (report.claimResults ?? []).find((result) =>
            result.claim?.text?.includes('165 files')
          );
          if (!quantified) throw new Error('Expected the real 165-file completion claim');
          if (quantified.status !== 'UNPROVEN') {
            throw new Error(`165-file claim must be UNPROVEN in public 0.1.18, got ${quantified.status}`);
          }
          const ordinaryBuild = (report.claimResults ?? []).find((result) =>
            result.claim?.text?.includes('./gradlew build --rerun-tasks')
          );
          if (!ordinaryBuild) throw new Error('Expected ordinary build completion claim');
          if (ordinaryBuild.status !== 'PROVEN') {
            throw new Error(`Ordinary build claim should remain PROVEN, got ${ordinaryBuild.status}`);
          }
          console.log(`Public 0.1.18 quantified claim: ${quantified.status}`);
          console.log(`Public 0.1.18 ordinary build claim: ${ordinaryBuild.status}`);
          NODE

      - name: Run current composite Action against InsForge
        uses: ./
        with:
          repo: InsForge/InsForge
          issue: 1990
          pr: 1991
          policy: report-only
          github_summary: "false"
          token: ""

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build current PRTruth
        run: pnpm build

      - name: Run current PRTruth against independent quantitative oracle
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo InsForge/InsForge \
            --issue 1990 \
            --pr 1991 \
            --policy report-only \
            --format json \
            --output dogfood-results/insforge-1990-1991.json

      - name: Compare with independent oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const report = JSON.parse(readFileSync('dogfood-results/insforge-1990-1991.json', 'utf8')).report;
          if (report.issueNumber !== 1990) throw new Error(`Expected issue #1990, got #${report.issueNumber}`);
          if (!Array.isArray(report.checks) || report.checks.length === 0) throw new Error('Expected observable GitHub CI evidence');
          const countClaim = (report.claimResults ?? []).find((result) => result.claim?.text?.includes('2 passed, 0 failed'));
          if (!countClaim) throw new Error('Expected executed test-count claim');
          if (countClaim.status !== 'UNPROVEN') throw new Error(`Exact count must remain UNPROVEN, got ${countClaim.status}`);
          const unitTests = report.checks.find((check) => check.name === 'Unit Tests');
          if (!unitTests || unitTests.conclusion !== 'success') throw new Error('Expected successful Unit Tests check');
          console.log(`InsForge verdict: ${report.verdict}`);
          console.log(`Quantitative claim: ${countClaim.status}`);
          NODE
