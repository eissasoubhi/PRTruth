name: Validate public 0.1.19

on:
  pull_request:
    paths:
      - ".github/workflows/validate-0.1.19-public.yml"

permissions:
  contents: read
  actions: read
  checks: read
  issues: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Wait for exact public npm package
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          EXPECTED_VERSION="0.1.19"
          for attempt in $(seq 1 40); do
            PUBLISHED_VERSION="$(npm view "prtruth@${EXPECTED_VERSION}" version --silent 2>/dev/null || true)"
            LATEST_VERSION="$(npm view prtruth dist-tags.latest --silent 2>/dev/null || true)"
            if [[ "${PUBLISHED_VERSION}" == "${EXPECTED_VERSION}" && "${LATEST_VERSION}" == "${EXPECTED_VERSION}" ]]; then
              echo "Public npm exposes prtruth@${EXPECTED_VERSION} as latest."
              exit 0
            fi
            if [[ "${attempt}" -eq 40 ]]; then
              echo "prtruth@${EXPECTED_VERSION} was not publicly resolvable as latest after ${attempt} attempts."
              exit 1
            fi
            sleep 6
          done

      - name: Verify public CLI and historical evidence fix
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        run: |
          set -euo pipefail
          EXPECTED_VERSION="0.1.19"
          TEMP_DIR="$(mktemp -d)"
          trap 'rm -rf "${TEMP_DIR}"' EXIT
          cd "${TEMP_DIR}"

          CLI_VERSION="$(npx -y "prtruth@${EXPECTED_VERSION}" --version)"
          test "${CLI_VERSION}" = "${EXPECTED_VERSION}"

          HELP_OUTPUT="$(npx -y "prtruth@${EXPECTED_VERSION}" --help)"
          grep -F -- "--issue <number>" <<<"${HELP_OUTPUT}"
          grep -F -- "--pr <number>" <<<"${HELP_OUTPUT}"
          grep -F -- "--repo <owner/repo>" <<<"${HELP_OUTPUT}"
          grep -F -- "--format <format>" <<<"${HELP_OUTPUT}"
          grep -F -- "--output <path>" <<<"${HELP_OUTPUT}"
          grep -F -- "--github-summary" <<<"${HELP_OUTPUT}"
          grep -F -- "--comment" <<<"${HELP_OUTPUT}"
          grep -F -- "--policy <policy>" <<<"${HELP_OUTPUT}"
          grep -F -- "--color <mode>" <<<"${HELP_OUTPUT}"

          mkdir -p reports
          npx -y "prtruth@${EXPECTED_VERSION}" verify \
            --repo mydcc/cachy-app \
            --issue 2201 \
            --pr 2279 \
            --policy report-only \
            --format json \
            --output reports/cachy.json

          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('reports/cachy.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          if (results.length !== 2) throw new Error(`Expected 2 acceptance criteria, got ${results.length}`);
          const redFirst = results.find((r) => /failing before the fix/i.test(r.requirement?.text ?? ''));
          if (!redFirst) throw new Error('Missing historical red-first criterion');
          if (redFirst.status !== 'UNPROVEN') {
            throw new Error(`Public 0.1.19 must keep unobserved pre-fix history UNPROVEN, got ${redFirst.status}`);
          }
          if (report.verdict === 'PROVEN') throw new Error('Historical red-first oracle must not be globally PROVEN');
          console.log(`Public 0.1.19 red-first criterion: ${redFirst.status}`);
          NODE

      - name: Run exact-version composite Action
        uses: ./
        with:
          repo: mydcc/cachy-app
          issue: 2201
          pr: 2279
          policy: report-only
          github_summary: "false"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build current source
        run: pnpm build

      - name: Re-run independent current-source oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo mydcc/cachy-app \
            --issue 2201 \
            --pr 2279 \
            --policy report-only \
            --format json \
            --output oracle-results/cachy.json
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/cachy.json', 'utf8'));
          const report = payload.report ?? payload;
          const redFirst = (report.results ?? []).find((r) => /failing before the fix/i.test(r.requirement?.text ?? ''));
          if (!redFirst || redFirst.status !== 'UNPROVEN') throw new Error('Current source historical oracle regressed');
          NODE
