name: Publish npm package

on:
  release:
    types: [published]
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to publish (for example v0.1.0)
        required: true
        default: v0.1.0

permissions:
  contents: read

jobs:
  publish:
    name: validate / build / publish npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout source for version resolution
        if: github.event_name == 'push'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Resolve release tag
        id: release
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          elif [[ "${GITHUB_EVENT_NAME}" == "release" ]]; then
            TAG="${RELEASE_TAG}"
          else
            PACKAGE_VERSION="$(node -p "require('./package.json').version")"
            TAG="v${PACKAGE_VERSION}"
          fi
          if [[ -z "${TAG}" ]]; then
            echo "Unable to resolve a release tag."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org/

      - name: Validate package version matches tag
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${{ steps.release.outputs.tag }}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${{ steps.release.outputs.tag }} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi

      - name: Check whether npm version already exists
        id: npm
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --silent >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_NAME}@${PACKAGE_VERSION} is already published; skipping."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.npm.outputs.exists != 'true'
        run: |
          rm -rf node_modules
          pnpm install --no-frozen-lockfile --prod=false --force

      - name: Typecheck
        if: steps.npm.outputs.exists != 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.npm.outputs.exists != 'true'
        run: pnpm test

      - name: Build
        if: steps.npm.outputs.exists != 'true'
        run: pnpm build

      - name: Validate npm package contents
        if: steps.npm.outputs.exists != 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package from public registry
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          for attempt in $(seq 1 20); do
            PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --silent 2>/dev/null || true)"
            if [[ "${PUBLISHED_VERSION}" == "${PACKAGE_VERSION}" ]]; then
              TEMP_DIR="$(mktemp -d)"
              if CLI_VERSION="$(cd "${TEMP_DIR}" && npx -y "${PACKAGE_NAME}@${PACKAGE_VERSION}" --version 2>/dev/null)" \
                && [[ "${CLI_VERSION}" == "${PACKAGE_VERSION}" ]]; then
                echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION} from the public npm registry."
                exit 0
              fi
            fi

            if [[ "${attempt}" -eq 20 ]]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} was not installable from the public npm registry after ${attempt} attempts."
              exit 1
            fi

            echo "Registry has not exposed a usable ${PACKAGE_NAME}@${PACKAGE_VERSION} yet; retrying in 6s (${attempt}/20)."
            sleep 6
          done
