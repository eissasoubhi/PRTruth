name: Publish npm package

on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published GitHub release tag (for example v0.1.8)
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: validate / build / publish npm
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Resolve release source
        id: source
        shell: bash
        env:
          WORKFLOW_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            REF="${{ inputs.tag }}"
          else
            REF="${WORKFLOW_HEAD_SHA}"
          fi
          if [[ -z "${REF}" ]]; then
            echo "Unable to resolve the release source ref."
            exit 1
          fi
          echo "ref=${REF}" >> "$GITHUB_OUTPUT"

      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.ref }}
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js for npm
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0
          registry-url: https://registry.npmjs.org/

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          EXPECTED_TAG="v${PACKAGE_VERSION}"
          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${EXPECTED_TAG}"
          fi
          if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
            echo "Release tag ${TAG} does not match package version ${PACKAGE_VERSION}."
            exit 1
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Validate published GitHub release exists
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;
            const release = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
            if (release.data.draft) {
              core.setFailed(`Release ${tag} is still a draft; publish it on GitHub before publishing npm.`);
              return;
            }
            core.info(`npm publish is authorized by published GitHub release ${release.data.html_url}`);

      - name: Check whether npm version already exists
        id: npm
        shell: bash
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          PACKAGE_SPEC="${PACKAGE_NAME}@${PACKAGE_VERSION}"

          set +e
          LOOKUP_OUTPUT="$(npm view "${PACKAGE_SPEC}" version --json 2>&1)"
          LOOKUP_STATUS=$?
          set -e

          if [[ "${LOOKUP_STATUS}" -eq 0 ]]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_SPEC} is already published; skipping."
          elif grep -Eq 'E404|404 Not Found|is not in this registry' <<<"${LOOKUP_OUTPUT}"; then
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "${PACKAGE_SPEC} is not published yet."
          else
            echo "Unable to determine whether ${PACKAGE_SPEC} already exists in the public npm registry." >&2
            printf '%s\n' "${LOOKUP_OUTPUT}" >&2
            exit "${LOOKUP_STATUS}"
          fi

      - name: Install dependencies
        if: steps.npm.outputs.exists != 'true'
        run: |
          rm -rf node_modules
          pnpm install --no-frozen-lockfile --prod=false --force

      - name: Typecheck
        if: steps.npm.outputs.exists != 'true'
        run: pnpm typecheck

      - name: Test
        if: steps.npm.outputs.exists != 'true'
        run: pnpm test

      - name: Build
        if: steps.npm.outputs.exists != 'true'
        run: pnpm build

      - name: Validate npm package contents
        if: steps.npm.outputs.exists != 'true'
        run: npm pack --dry-run

      - name: Publish to npm
        if: steps.npm.outputs.exists != 'true'
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Verify published package from public registry
        shell: bash
        env:
          NPM_CONFIG_USERCONFIG: /dev/null
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"

          for attempt in $(seq 1 20); do
            PUBLISHED_VERSION="$(npm view "${PACKAGE_NAME}@${PACKAGE_VERSION}" version --silent 2>/dev/null || true)"
            if [[ "${PUBLISHED_VERSION}" == "${PACKAGE_VERSION}" ]]; then
              TEMP_DIR="$(mktemp -d)"
              if CLI_VERSION="$(cd "${TEMP_DIR}" && npx -y "${PACKAGE_NAME}@${PACKAGE_VERSION}" --version 2>/dev/null)" \
                && [[ "${CLI_VERSION}" == "${PACKAGE_VERSION}" ]]; then
                rm -rf "${TEMP_DIR}"
                echo "Verified ${PACKAGE_NAME}@${PACKAGE_VERSION} from the public npm registry."
                exit 0
              fi
              rm -rf "${TEMP_DIR}"
            fi

            if [[ "${attempt}" -eq 20 ]]; then
              echo "${PACKAGE_NAME}@${PACKAGE_VERSION} was not installable from the public npm registry after ${attempt} attempts."
              exit 1
            fi

            echo "Registry has not exposed a usable ${PACKAGE_NAME}@${PACKAGE_VERSION} yet; retrying in 6s (${attempt}/20)."
            sleep 6
          done
