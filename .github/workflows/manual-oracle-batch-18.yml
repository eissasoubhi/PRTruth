name: Manual oracle batch 18

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-18.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-18.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run shutdown verification oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo The-Running-Dev/SubZeroDev.SkyNetHR \
            --issue 197 \
            --pr 213 \
            --policy report-only \
            --format json \
            --output oracle-results/skynethr-197-213.json
      - name: Assert exact-head versus container-proof boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/skynethr-197-213.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);

          if (results.length !== 7) {
            throw new Error(`Expected exactly 7 authoritative shutdown criteria, observed ${results.length}`);
          }

          const containerSmoke = results.find((result) =>
            /container smoke test verifies shutdown completes without escalation/i.test(result.requirement?.text ?? '')
          );
          if (!containerSmoke) {
            throw new Error('Container shutdown smoke criterion was not extracted');
          }
          if (containerSmoke.status === 'PROVEN') {
            throw new Error('Green exact-head Linux/Windows CI must not prove an unobserved container shutdown smoke test');
          }

          // Independent oracle: PR #213 has strong exact-head Linux evidence for the
          // signal/subprocess regressions that were skipped on the author's Windows host.
          // The issue separately requires a container smoke proving shutdown completes
          // without escalation. The PR documents unit/subprocess/Pester evidence but no
          // container-level smoke. Platform CI may strengthen platform-scoped criteria;
          // it must not silently widen into a stronger container-runtime claim.
          if (report.verdict === 'PROVEN') {
            throw new Error('Shutdown issue must not become globally PROVEN while the container-smoke criterion lacks observable evidence');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-18
          path: oracle-results/*.json
