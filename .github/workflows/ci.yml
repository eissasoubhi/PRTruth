name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  issues: read
  pull-requests: read
  checks: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Dogfood PRTruth on PR #1
        if: github.event_name == 'pull_request'
        run: |
          set +e
          node dist/cli.js verify --repo eissasoubhi/PRTruth --issue 1 --pr 1 --format markdown | tee prtruth-dogfood.md
          code=${PIPESTATUS[0]}
          echo "PRTruth exit code: $code"
          exit 0
