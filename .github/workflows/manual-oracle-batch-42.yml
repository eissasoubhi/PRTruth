name: Manual oracle batch 42

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-42.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  exact-head-path-presence:
    name: Exact-head path presence oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real recipe-book history
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo The-4Script/recipe-book \
            --issue 11 \
            --pr 19 \
            --policy report-only \
            --format json \
            --output dogfood-results/recipe-book-19.json

      - name: Compare with independent path-state oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(
            readFileSync('dogfood-results/recipe-book-19.json', 'utf8')
          ).report;

          const exactCriterion = report.results.find(
            (result) => result.requirement.text === '`cooking-tips/README.md` exists'
              || result.requirement.text === '`cooking-tips/README.md` exists.'
          );

          if (!exactCriterion) {
            throw new Error('Expected the exact cooking-tips/README.md existence criterion to be extracted.');
          }
          if (exactCriterion.status !== 'PROVEN') {
            throw new Error(`Expected exact path existence to be PROVEN, got ${exactCriterion.status}: ${exactCriterion.reason}`);
          }
          if (!exactCriterion.evidence.some((item) => item.kind === 'repository' && item.summary.includes('cooking-tips/README.md'))) {
            throw new Error('Expected repository-state evidence for cooking-tips/README.md.');
          }

          const strongerCriteria = report.results.filter(
            (result) => result.requirement.text !== exactCriterion.requirement.text
          );
          if (strongerCriteria.some((result) => result.status === 'PROVEN')) {
            throw new Error('File presence must not promote unrelated content/process criteria to PROVEN.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            exactPathCriterion: exactCriterion.status,
            otherCriteria: strongerCriteria.map((result) => ({
              text: result.requirement.text,
              status: result.status
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-42
          path: dogfood-results/recipe-book-19.json
          if-no-files-found: error
