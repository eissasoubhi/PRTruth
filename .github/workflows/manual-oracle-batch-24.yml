name: Manual oracle batch 24

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-24.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-24.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run git-failure diagnostic oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo marcosfsousa/mcp-erp \
            --issue 126 \
            --pr 130 \
            --policy report-only \
            --format json \
            --output oracle-results/mcp-erp-126-130.json
      - name: Assert conservative evidence boundaries
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/mcp-erp-126-130.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          if (results.length !== 4) {
            throw new Error(`Expected exactly 4 acceptance criteria from issue #126, observed ${results.length}`);
          }

          const expected = [
            /git show.*failure.*exit status.*stderr/i,
            /Path not in HEAD.*same message/i,
            /test simulates a git invocation failing/i,
            /module docstring.*git failures.*true/i,
          ];
          for (const pattern of expected) {
            if (!results.some((r) => pattern.test(r.requirement?.text ?? ''))) {
              throw new Error(`Missing expected acceptance criterion: ${pattern}`);
            }
          }

          // Human oracle is 4/4 PROVEN from the implementation, focused tests,
          // and exact-head CI. PRTruth may remain conservative until a sound
          // source/test semantic adapter exists. Generic green CI or a separate
          // failure-swallowing `|| true` command must never fill that gap.
          if (report.verdict === 'PROVEN' && results.some((r) => r.status !== 'PROVEN')) {
            throw new Error('Global verdict cannot be PROVEN with unresolved acceptance criteria');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-24
          path: oracle-results/*.json
