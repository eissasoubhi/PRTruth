name: Manual oracle batch 54

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-54.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  skipped-validation:
    name: TCJ skipped-validation oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real skipped-validation history
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo Amir-ESH/TCJ.Framework \
            --issue 106 \
            --pr 162 \
            --policy report-only \
            --format json \
            --output dogfood-results/tcj-framework-162.json

      - name: Compare with independent skipped-validation oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('dogfood-results/tcj-framework-162.json', 'utf8')).report;

          if (report.results.length !== 4) {
            throw new Error(`Expected exactly 4 authoritative acceptance criteria, received ${report.results.length}.`);
          }

          const claims = report.claimResults ?? [];
          const property = claims.find((result) => /Property tests pass/i.test(result.claim.text));
          const resilience = claims.find((result) => /Resilience tests pass/i.test(result.claim.text));

          if (!property || !resilience) {
            throw new Error('Expected checked PR validation claims for property testing and resilience testing to be extracted.');
          }

          // Independent inspection of issue #106, PR #162, exact-head checks,
          // and .github/workflows/ci.yml shows a deliberately nuanced case:
          // Core CI really runs property tests and then enforces their outcome,
          // so the property claim has direct successful evidence even though a
          // separate long-running property/fuzz lane is skipped.
          if (property.status !== 'PROVEN') {
            throw new Error(`Direct successful property-test evidence should remain PROVEN, received ${property.status}.`);
          }

          // The resilience checklist claim is stronger: it explicitly includes
          // fault-injection and concurrency scenarios. Core CI runs only the
          // fast resilience subset, while the exact dedicated `Resilience fault
          // injection` and `Concurrency stress` checks are skipped. Generic or
          // partial resilience success must not prove those named clauses.
          if (resilience.status === 'PROVEN') {
            throw new Error('Compound resilience claim must not be PROVEN while fault-injection and concurrency lanes are skipped.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            selectedClaims: [property, resilience].map((result) => ({
              text: result.claim.text,
              status: result.status,
              reason: result.reason
            })),
            criteria: report.results.map((result) => ({
              text: result.requirement.text,
              status: result.status,
              reason: result.reason
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-54
          path: dogfood-results/tcj-framework-162.json
          if-no-files-found: error
