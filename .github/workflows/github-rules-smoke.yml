name: GitHub rules evidence smoke

on:
  pull_request:
    paths:
      - "src/github.ts"
      - "src/verify.ts"
      - "src/ci-evidence.ts"
      - "src/types.ts"
      - "test/required-check-config.test.ts"
      - ".github/workflows/github-rules-smoke.yml"
  workflow_dispatch:
  schedule:
    - cron: "41 7 * * 1"

permissions:
  contents: read

jobs:
  public-rules-api:
    name: validate public branch/rules metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Exercise real public branch and rules endpoints
        shell: bash
        env:
          GITHUB_TOKEN: ""
        run: |
          node --input-type=module <<'NODE'
          import { GitHubClient } from './dist/github.js';

          const headers = {
            Accept: 'application/vnd.github+json',
            'X-GitHub-Api-Version': '2022-11-28'
          };

          const branchResponse = await fetch(
            'https://api.github.com/repos/kubernetes/kubernetes/branches/master',
            { headers }
          );
          if (!branchResponse.ok) {
            throw new Error(`public branch metadata returned HTTP ${branchResponse.status}`);
          }
          const branch = await branchResponse.json();
          const classicChecks = branch?.protection?.required_status_checks?.checks ?? [];
          if (!Array.isArray(classicChecks) || classicChecks.length === 0) {
            throw new Error('expected real classic required-check metadata from kubernetes/kubernetes');
          }
          const pinnedClassicChecks = classicChecks.filter(
            (check) => typeof check?.app_id === 'number' && check.app_id > 0
          );
          if (pinnedClassicChecks.length === 0) {
            throw new Error('expected at least one app-pinned Kubernetes required check');
          }

          const rulesResponse = await fetch(
            'https://api.github.com/repos/github/docs/rules/branches/main?per_page=100&page=1',
            { headers }
          );
          if (!rulesResponse.ok) {
            throw new Error(`public active-rules metadata returned HTTP ${rulesResponse.status}`);
          }
          const rules = await rulesResponse.json();
          if (!Array.isArray(rules)) {
            throw new Error('expected GitHub active branch rules endpoint to return an array');
          }

          const client = new GitHubClient(undefined);
          const requiredChecks = await client.getRequiredStatusCheckContexts(
            'kubernetes/kubernetes',
            'master'
          );
          if (!Array.isArray(requiredChecks) || requiredChecks.length === 0) {
            throw new Error('required-check resolver did not return Kubernetes required checks');
          }

          for (const expected of pinnedClassicChecks) {
            const observed = requiredChecks.find(
              (check) => check.context === expected.context && check.appId === expected.app_id
            );
            if (!observed) {
              throw new Error(
                `resolver lost app identity for ${expected.context} / app ${expected.app_id}`
              );
            }
          }

          console.log(`classic required checks observed: ${classicChecks.length}`);
          console.log(`app-pinned classic checks observed: ${pinnedClassicChecks.length}`);
          console.log(`active github/docs rules observed: ${rules.length}`);
          console.log(`resolver returned ${requiredChecks.length} source-aware required checks`);
          NODE