name: Manual oracle batch 63

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-63.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  verification-flight-lifecycle-boundary:
    name: Verification-flight lifecycle oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real verification-flight lifecycle history
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo The01Geek/prflow \
            --issue 1087 \
            --pr 1119 \
            --policy report-only \
            --format json \
            --output dogfood-results/prflow-1119.json

      - name: Compare with independent lifecycle oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(
            readFileSync('dogfood-results/prflow-1119.json', 'utf8')
          ).report;

          const finalTreeEvidence = report.results.find((result) =>
            /Final tree owns evidence/i.test(result.requirement.text)
          );

          if (!finalTreeEvidence) {
            throw new Error('Expected the final-tree verification lifecycle criterion to be extracted.');
          }

          // Independent inspection of The01Geek/prflow issue #1087, merged PR #1119,
          // and exact PR head 0c95370df7f885b4256d3f1f1ed1bac21637231a:
          // the issue requires a historical sequencing property: after the final candidate-changing
          // operation, Phase 4.3 must establish current verification-flight evidence, and a stale
          // earlier pass must trigger one final verification launch before publication/finalization.
          // The exact head exposes multiple successful current CI checks, but those checks do not
          // themselves prove that this historical lifecycle sequence occurred during the implement run.
          // PR/workpad prose saying the sequence happened is useful review context, not deterministic
          // execution evidence for the temporal property. Keep this criterion non-PROVEN unless a
          // directly corresponding durable machine record is observable.
          if (finalTreeEvidence.status === 'PROVEN') {
            throw new Error('Current-head green CI or lifecycle prose must not PROVE the historical final-tree verification-flight sequencing criterion.');
          }

          if (report.verdict === 'PROVEN') {
            throw new Error('Overall verdict must not be PROVEN while the historical final-tree verification lifecycle remains unobserved.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            target: {
              text: finalTreeEvidence.requirement.text,
              status: finalTreeEvidence.status,
              reason: finalTreeEvidence.reason
            },
            checks: report.checks
              .filter((check) => check.scope === 'check')
              .map((check) => ({ name: check.name, status: check.status, conclusion: check.conclusion }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-63
          path: dogfood-results/prflow-1119.json
          if-no-files-found: error
