name: Manual oracle batch 16

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-16.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-16.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run partial-completion lifecycle oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo launchpad-26/buzz \
            --issue 211 \
            --pr 573 \
            --policy report-only \
            --format json \
            --output oracle-results/buzz-211-573.json
      - name: Assert explicit Definition-of-done boundary
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/buzz-211-573.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          const byStatus = Object.groupBy(results, (r) => r.status);
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length} proven=${byStatus.PROVEN?.length ?? 0} failed=${byStatus.FAILED?.length ?? 0} unproven=${byStatus.UNPROVEN?.length ?? 0}`);
          for (const result of results) console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);

          if (results.length !== 6) throw new Error(`Expected 6 authoritative Definition-of-done criteria, got ${results.length}`);
          const texts = results.map((r) => r.requirement?.text ?? '');
          for (const signal of ['decision logic', 'default answer format', 'Every non-FACT claim', 'knowledge.find', 'UserRepository-style investigation trace']) {
            if (!texts.some((text) => text.includes(signal))) throw new Error(`Missing Definition-of-done signal: ${signal}`);
          }

          // Independent oracle: PR #573 explicitly states that two Definition-of-done
          // items remain unmet and were split to follow-up issues, while the exact-head
          // CI does not run the project-intelligence Python test suite. A merged PR or
          // closed parent issue must therefore never imply global completion by itself.
          if (report.verdict === 'PROVEN') {
            throw new Error('Partially completed Definition-of-done must not become globally PROVEN from merge/closure or unrelated green CI');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-16
          path: oracle-results/*.json
