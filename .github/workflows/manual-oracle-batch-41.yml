name: Manual oracle batch 41

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-41.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-41.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run PRTruth against checkpoint-cutover history
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo ll7/robot_sf_ll7 \
            --issue 6793 \
            --pr 7865 \
            --policy report-only \
            --format json \
            --output oracle-results/robot-sf-6793-7865.json
      - name: Assert exact-head absence is distinct from present repository state
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          import { inspectExactHeadPath } from './dist/exact-head-file.js';

          const repository = 'll7/robot_sf_ll7';
          const headSha = '07ed6f2a498b2d09086ff7f5002c29f1a4a5fa12';
          const reportPayload = JSON.parse(
            readFileSync('oracle-results/robot-sf-6793-7865.json', 'utf8')
          );
          const report = reportPayload.report ?? reportPayload;
          const results = report.results ?? [];

          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          const expectedCriterion = results.find((item) => {
            const text = item.requirement?.text ?? '';
            return text.includes('model/run_023.zip') && text.includes('model/run_043.zip');
          });
          if (!expectedCriterion) {
            throw new Error('Expected the explicit checkpoint-removal acceptance criterion');
          }

          const states = new Map();
          for (const path of [
            'model/run_023.zip',
            'model/run_043.zip',
            'model/run_023/README.md',
            'model/run_043/README.md'
          ]) {
            const state = await inspectExactHeadPath({ repository, path, headSha });
            states.set(path, state);
            console.log(`${path}: ${JSON.stringify(state)}`);
          }

          for (const path of ['model/run_023.zip', 'model/run_043.zip']) {
            if (states.get(path)?.state !== 'absent') {
              throw new Error(`Expected exact-head 404 absence for ${path}`);
            }
          }
          for (const path of ['model/run_023/README.md', 'model/run_043/README.md']) {
            if (states.get(path)?.state !== 'present') {
              throw new Error(`Expected exact-head presence for replacement stub ${path}`);
            }
          }

          if (report.verdict === 'PROVEN') {
            throw new Error(
              'Exact-head path state is supporting provenance only; it must not silently make the composite issue PROVEN'
            );
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-41
          path: oracle-results/*.json
