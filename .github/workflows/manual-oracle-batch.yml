name: Manual oracle batch

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  public-oracle-corpus:
    name: run public PR oracle corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build current PRTruth source
        run: pnpm build

      - name: Run public oracle corpus
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oracle-results

          run_case() {
            local name="$1"
            local repo="$2"
            local issue="$3"
            local pr="$4"
            echo "=== ${name}: ${repo}#${pr} / issue #${issue} ==="
            node dist/cli.js verify \
              --repo "${repo}" \
              --issue "${issue}" \
              --pr "${pr}" \
              --policy report-only \
              --format json \
              --output "oracle-results/${name}.json"
          }

          run_case ai-saas-v02 eissasoubhi/ai-saas-factory 1 3
          run_case ratq-draft-security Itqan-community/RATQ 151 254
          run_case aahp-criteria-lifecycle homeofe/AAHP 45 49
          run_case cove-content-scope yourcove/cove 454 455

      - name: Print compact verdict matrix
        if: always()
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';

          for (const file of readdirSync('oracle-results').filter((name) => name.endsWith('.json')).sort()) {
            const payload = JSON.parse(readFileSync(`oracle-results/${file}`, 'utf8'));
            const report = payload.report ?? payload;
            const counts = { PROVEN: 0, FAILED: 0, UNPROVEN: 0 };
            for (const result of report.results ?? []) {
              counts[result.status] = (counts[result.status] ?? 0) + 1;
            }
            console.log(`${file}: verdict=${report.verdict} requirements=${counts.PROVEN}/${counts.FAILED}/${counts.UNPROVEN} claims=${(report.claimResults ?? []).length}`);
            for (const result of report.results ?? []) {
              console.log(`  ${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing requirement>'}`);
            }
          }
          NODE

      - name: Upload oracle reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-1
          path: oracle-results/*.json
          if-no-files-found: warn
