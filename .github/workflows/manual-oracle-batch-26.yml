name: Manual oracle batch 26

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-26.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-26.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run retained-vs-live evidence oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo D0ubleD0uble/fieldglass \
            --issue 426 \
            --pr 457 \
            --policy report-only \
            --format json \
            --output oracle-results/fieldglass-426-457.json
      - name: Assert conservative scope behavior
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/fieldglass-426-457.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          if (results.length !== 3) {
            throw new Error(`Expected exactly 3 acceptance clauses from issue #426, observed ${results.length}`);
          }

          const expected = [
            /spot-check.*same abbreviation.*name.*units/i,
            /real GFS or HRRR file.*samples/i,
            /regeneration is byte-identical/i,
          ];
          for (const pattern of expected) {
            if (!results.some((r) => pattern.test(r.requirement?.text ?? ''))) {
              throw new Error(`Missing expected acceptance criterion: ${pattern}`);
            }
          }

          // Independent oracle: spot-checks are PROVEN by explicit tests plus
          // exact-head workspace execution; the literal GFS/HRRR-from-samples
          // criterion is FAILED because retained E2E uses an Eta fixture and the
          // live GFS run is not retained; byte-identical regeneration remains
          // UNPROVEN from authoritative exact-head evidence because no retained
          // CI step reruns the generator and asserts a clean diff.
          // PRTruth may remain conservative, but it must not promote the whole
          // issue merely because generic Rust CI is green or the PR body reports
          // a live manual run.
          if (report.verdict === 'PROVEN') {
            throw new Error('Generic green CI/live author claims must not make this mixed-scope oracle globally PROVEN');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-26
          path: oracle-results/*.json
