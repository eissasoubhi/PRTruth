name: Migrate Development Cockpit Token

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/migrate-development-cockpit-token.yml

permissions:
  contents: read

jobs:
  migrate:
    if: github.event.pull_request.head.ref == 'agent/remove-development-cockpit-host'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify source token
        shell: bash
        env:
          DEVELOPMENT_COCKPIT_TOKEN: ${{ secrets.DEVELOPMENT_COCKPIT_TOKEN }}
        run: |
          if [ -z "$DEVELOPMENT_COCKPIT_TOKEN" ]; then
            echo "DEVELOPMENT_COCKPIT_TOKEN is missing from PRTruth."
            exit 1
          fi

      - name: Copy token to ai-saas-factory
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.DEVELOPMENT_COCKPIT_TOKEN }}
          DEVELOPMENT_COCKPIT_TOKEN: ${{ secrets.DEVELOPMENT_COCKPIT_TOKEN }}
        run: |
          gh secret set DEVELOPMENT_COCKPIT_TOKEN \
            --repo eissasoubhi/ai-saas-factory \
            --body "$DEVELOPMENT_COCKPIT_TOKEN"
