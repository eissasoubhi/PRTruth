name: Manual oracle batch 8

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-8.yml'
      - 'src/**'
      - 'tests/**'
      - 'docs/manual-oracle-batch-8.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run deterministic frontend-CI oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo misospace/KubeTix \
            --issue 359 \
            --pr 373 \
            --policy report-only \
            --format json \
            --output oracle-results/kubetix-359-373.json
      - name: Assert exact acceptance set and print matrix
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/kubetix-359-373.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          const texts = results.map((result) => result.requirement?.text ?? '');
          if (results.length !== 3) {
            throw new Error(`Expected exactly three Acceptance requirements, got ${results.length}`);
          }
          const expectedSignals = [
            'npm test` runs in CI',
            'same Node version as the build job',
            'added CI job appearing in checks'
          ];
          for (const signal of expectedSignals) {
            if (!texts.some((text) => text.includes(signal))) {
              throw new Error(`Missing acceptance requirement containing: ${signal}`);
            }
          }
          const forbiddenEvidence = [
            'package.json` — `"test": "vitest run"` script exists',
            'grep for `npm test` / `vitest` across `.github/` finds none',
            'no Node/vitest test job'
          ];
          for (const signal of forbiddenEvidence) {
            if (texts.some((text) => text.includes(signal))) {
              throw new Error(`Evidence metadata was incorrectly extracted as a requirement: ${signal}`);
            }
          }
          const req = Object.groupBy(results, (r) => r.status);
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length} proven=${req.PROVEN?.length ?? 0} failed=${req.FAILED?.length ?? 0} unproven=${req.UNPROVEN?.length ?? 0}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-8
          path: oracle-results/*.json
