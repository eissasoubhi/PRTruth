name: Manual oracle batch 17

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-17.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-17.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run hardware-bound verification oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo batonogov/terraform-provider-synology-dsm \
            --issue 121 \
            --pr 127 \
            --policy report-only \
            --format json \
            --output oracle-results/synology-121-127.json
      - name: Assert hardware-proof ceiling
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/synology-121-127.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);

          // Independent oracle: PR #127 strongly supports the requested writable
          // firewall switch and lockout guard through implementation and focused tests,
          // and exact-head repository CI is green. However, the PR explicitly says
          // nothing was run against a physical NAS. Generic CI therefore cannot prove
          // real-device behavior that the candidate itself marks unverified.
          if (report.verdict === 'PROVEN') {
            throw new Error('Hardware-bound firewall behavior must not become globally PROVEN from simulated/unit CI alone');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-17
          path: oracle-results/*.json
