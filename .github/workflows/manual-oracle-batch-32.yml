name: Manual oracle batch 32

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-32.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-32.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run workflow-dispatch Windows oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo cfg-is/cfgms \
            --issue 3470 \
            --pr 3477 \
            --policy report-only \
            --format json \
            --output oracle-results/cfgms-3470-3477.json
      - name: Print and guard requirement set
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/cfgms-3470-3477.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }
          if (results.length !== 4) {
            throw new Error(`Expected exactly 4 acceptance criteria from issue #3470, observed ${results.length}`);
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-32
          path: oracle-results/*.json
