name: Manual oracle batch 35

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-35.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-35.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run Python CI and branch-protection oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo Seretos/agent-worktree \
            --issue 168 \
            --pr 173 \
            --policy report-only \
            --format json \
            --output oracle-results/agent-worktree-168-173.json
      - name: Assert out-of-band protection remains fail-closed
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/agent-worktree-168-173.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          if (results.length !== 5) {
            throw new Error(`Expected exactly 5 acceptance criteria from issue #168, observed ${results.length}`);
          }

          const protection = results.find((result) =>
            /Branch Protection.*main.*aktiv|Branch Protection.*main.*active/i.test(result.requirement?.text ?? '')
          );
          if (!protection) {
            throw new Error('Expected the explicit main-branch protection acceptance criterion to be extracted');
          }
          if (protection.status === 'PROVEN') {
            throw new Error('Merged/closed lifecycle and green PR CI must not prove an explicitly out-of-band branch-protection requirement');
          }
          if (report.verdict === 'PROVEN') {
            throw new Error('The report must not be globally PROVEN while the required branch-protection setting lacks trustworthy proof');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-35
          path: oracle-results/*.json
