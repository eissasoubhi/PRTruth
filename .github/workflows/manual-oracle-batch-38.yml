name: Manual oracle batch 38

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-38.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-38.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run SDK hard-stop scope oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo wisecom-oy/atlas \
            --issue 180 \
            --pr 183 \
            --policy report-only \
            --format json \
            --output oracle-results/atlas-180-183.json
      - name: Assert partial delivery is never over-proven
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/atlas-180-183.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          if (results.length !== 4) {
            throw new Error(`Expected exactly 4 acceptance criteria from issue #180, observed ${results.length}`);
          }

          const drives = results.find((result) => /Outlook, OneDrive, and SharePoint backups/i.test(result.requirement?.text ?? ''));
          if (!drives) throw new Error('Expected cross-workload hard-stop acceptance criterion');
          if (drives.status === 'PROVEN') {
            throw new Error('Cross-workload criterion must not be PROVEN: PR #183 explicitly omits OneDrive and SharePoint');
          }

          const behaviorTest = results.find((result) => /forced stop ends the run without finishing the current unit/i.test(result.requirement?.text ?? ''));
          if (!behaviorTest) throw new Error('Expected forced-stop behavior-test acceptance criterion');
          if (behaviorTest.status === 'PROVEN') {
            throw new Error('Behavior-test criterion must not be PROVEN: added tests cover option adaptation, not end-to-end stop semantics');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-38
          path: oracle-results/*.json
