name: Manual oracle batch 75

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-75.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  utc-boundary-red-green:
    name: UTC-boundary historical red-green oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real UTC-boundary oracle
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo cfg-is/cfgms \
            --issue 3707 \
            --pr 3709 \
            --policy report-only \
            --format json \
            --output dogfood-results/cfgms-3709.json

      - name: Compare with independent historical red-green oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(
            readFileSync('dogfood-results/cfgms-3709.json', 'utf8')
          ).report;

          // Independent inspection of cfg-is/cfgms issue #3707 and merged PR #3709:
          // - the issue defines five acceptance criteria and explicitly requires a deterministic
          //   pre-fix failure at a named UTC-boundary offset, then a passing post-fix run;
          // - AC4 separately requires the extended regression guard to FAIL with AC3 reverted
          //   and PASS with the fix restored;
          // - PR #3709 reports that local manual red-green exercise in prose and names +2.5s;
          // - exact PR head c3a1336f70bf80b9a563f069bbb131f69bb9d0ac exposes broad successful
          //   Test Suite Validation, lint, CodeQL, security, production-risk, and cross-platform CI;
          // - the observable PR-head unit job runs generic `Run Fast Unit Tests`; the queue-only
          //   integration path is a PR-time stub, and none of those current-head successes directly
          //   execute the historical unmodified-develop or revert-the-fix counterfactuals;
          // - therefore current green CI can support present-head checks but must not PROVE either
          //   historical red-before-green acceptance criterion solely from PR prose.

          if (report.results.length !== 5) {
            throw new Error(`Expected exactly 5 authoritative acceptance criteria, received ${report.results.length}.`);
          }

          const deterministicReproduction = report.results.find((result) =>
            /deterministic reproduction before any fix|fails on unmodified.*develop.*passes after/i.test(result.requirement.text)
          );
          if (!deterministicReproduction) {
            throw new Error('Expected AC1 deterministic pre-fix reproduction criterion.');
          }
          if (deterministicReproduction.status === 'PROVEN') {
            throw new Error('Current-head green CI and PR-reported local validation must not PROVE the historical pre-fix fail -> post-fix pass criterion.');
          }

          const revertedGuard = report.results.find((result) =>
            /regression guard covers the real mechanism|fails if AC3.*fix is reverted.*passes with it/i.test(result.requirement.text)
          );
          if (!revertedGuard) {
            throw new Error('Expected AC4 reverted-fix regression-guard criterion.');
          }
          if (revertedGuard.status === 'PROVEN') {
            throw new Error('Generic current-head tests must not PROVE that the guard was actually observed failing with the fix reverted.');
          }

          if (report.verdict === 'PROVEN') {
            throw new Error('Overall verdict must not be PROVEN while required historical counterfactual evidence remains unobserved.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            criteria: report.results.map((result) => ({
              text: result.requirement.text,
              status: result.status,
              reason: result.reason
            })),
            checks: report.checks.map((check) => ({
              name: check.name,
              scope: check.scope,
              status: check.status,
              conclusion: check.conclusion
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-75
          path: dogfood-results/cfgms-3709.json
          if-no-files-found: error
