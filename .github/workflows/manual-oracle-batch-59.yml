name: Manual oracle batch 59

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-59.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  composer-installed-runtime-boundary:
    name: Opus Composer installed-runtime oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real Composer installed-runtime history
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo BlueFissionTech/opus \
            --issue 50 \
            --pr 55 \
            --policy report-only \
            --format json \
            --output dogfood-results/opus-55.json

      - name: Compare with independent Composer installed-runtime oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(readFileSync('dogfood-results/opus-55.json', 'utf8')).report;

          if (report.results.length !== 9) {
            throw new Error(`Expected exactly 9 authoritative Acceptance Criteria, received ${report.results.length}.`);
          }

          const sourceBehavior = report.results.find((result) => /Preserve source-checkout behavior/i.test(result.requirement.text));
          const installedValidator = report.results.find((result) => /add-on validator entrypoint works from an installed package/i.test(result.requirement.text));
          const installedTemplates = report.results.find((result) => /anonymous login and administration routes can render package-owned templates/i.test(result.requirement.text));
          const installedDistribution = report.results.find((result) => /Composer-installed distribution packages/i.test(result.requirement.text));

          if (!sourceBehavior || !installedValidator || !installedTemplates || !installedDistribution) {
            throw new Error('Expected representative Composer runtime acceptance criteria to be extracted.');
          }

          // Independent inspection of issue #50, merged PR #55, and exact head
          // faf692fe845094097846c914aef6846aafeda9fd: the PR prose reports focused/full
          // PHPUnit, optimized Composer autoload, archive contents, installed-command proof,
          // and template rendering. GitHub exposes only one exact-head successful check:
          // `Analyze (javascript-typescript)`. That unrelated analysis lane cannot prove PHP,
          // Composer-installed runtime, archive, or template-rendering acceptance criteria.
          const exactHeadChecks = report.checks.filter((check) => check.scope === 'check');
          const unrelatedAnalysis = exactHeadChecks.find((check) =>
            /Analyze \(javascript-typescript\)/i.test(check.name) && check.conclusion === 'success'
          );

          if (!unrelatedAnalysis) {
            throw new Error('Expected the exact-head JavaScript/TypeScript analysis check to be observable.');
          }

          for (const result of [sourceBehavior, installedValidator, installedTemplates, installedDistribution]) {
            if (result.status === 'PROVEN') {
              throw new Error(`PR self-report plus unrelated analysis must not PROVE Composer/PHP runtime behavior: ${result.requirement.text}`);
            }
          }

          if (report.verdict === 'PROVEN') {
            throw new Error('Overall verdict must not be PROVEN when exact-head GitHub evidence does not execute the claimed PHP/Composer validations.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            exactHeadChecks: exactHeadChecks.map((check) => ({ name: check.name, conclusion: check.conclusion })),
            criteria: report.results.map((result) => ({
              text: result.requirement.text,
              status: result.status,
              reason: result.reason
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-59
          path: dogfood-results/opus-55.json
          if-no-files-found: error
