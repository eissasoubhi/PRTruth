name: Manual oracle batch 36

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-36.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-36.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read
  pull-requests: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run Go certificate-authority oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo cfg-is/cfgms \
            --issue 3541 \
            --pr 3555 \
            --policy report-only \
            --format json \
            --output oracle-results/cfgms-3541-3555.json
      - name: Assert delegated docs and full-suite claims remain fail-closed
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/cfgms-3541-3555.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          if (results.length !== 6) {
            throw new Error(`Expected exactly 6 acceptance criteria from issue #3541, observed ${results.length}`);
          }

          const docs = results.find((result) => /Docs:\s*N\/A|Story G owns/i.test(result.requirement?.text ?? ''));
          const fullSuite = results.find((result) => /make test-complete.*passes/i.test(result.requirement?.text ?? ''));
          if (!docs || !fullSuite) {
            throw new Error('Expected both delegated-documentation and make test-complete criteria to be extracted');
          }
          if (docs.status === 'PROVEN') {
            throw new Error('Merged/closed lifecycle must not turn an explicitly delegated N/A documentation criterion into factual PROVEN');
          }
          if (fullSuite.status === 'PROVEN') {
            throw new Error('A green PR-time unit-test job must not prove the distinct make test-complete acceptance criterion');
          }
          if (report.verdict === 'PROVEN') {
            throw new Error('The report must remain fail-closed while delegated resolution and full-suite execution lack direct proof');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-36
          path: oracle-results/*.json
