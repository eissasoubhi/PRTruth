name: Manual oracle batch 28

on:
  pull_request:
    paths:
      - '.github/workflows/manual-oracle-batch-28.yml'
      - 'src/**'
      - 'test/**'
      - 'docs/manual-oracle-batch-28.md'
  workflow_dispatch:

permissions:
  contents: read
  issues: read
  actions: read
  checks: read

jobs:
  public-oracle:
    runs-on: ubuntu-24.04
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: 'false'
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false
      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force
      - name: Build current PRTruth source
        run: pnpm build
      - name: Run browser-session storage oracle
        run: |
          mkdir -p oracle-results
          node dist/cli.js verify \
            --repo perrykennethw/Wangz-Gamenight \
            --issue 76 \
            --pr 78 \
            --policy report-only \
            --format json \
            --output oracle-results/wangz-76-78.json
      - name: Assert conservative requirement extraction
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const payload = JSON.parse(readFileSync('oracle-results/wangz-76-78.json', 'utf8'));
          const report = payload.report ?? payload;
          const results = report.results ?? [];
          console.log(`verdict=${report.verdict}`);
          console.log(`requirements=${results.length}`);
          for (const result of results) {
            console.log(`${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
          }

          if (results.length !== 8) {
            throw new Error(`Expected exactly 8 acceptance criteria from issue #76, observed ${results.length}`);
          }

          const expected = [
            /joining continues.*reads or writes throw/i,
            /malformed stored identifier.*replaced/i,
            /valid stored identifier.*reused/i,
            /fallback identifier remains stable/i,
            /versioned.*migration-safe key contract/i,
            /Focused tests cover missing, valid, malformed, throwing-read, and throwing-write/i,
            /server-side validation.*duplicate-participant protection remain unchanged/i,
            /npm run verify.*passes/i,
          ];
          for (const pattern of expected) {
            if (!results.some((r) => pattern.test(r.requirement?.text ?? ''))) {
              throw new Error(`Missing expected acceptance criterion: ${pattern}`);
            }
          }

          // Independent human oracle: 8/8 are supported by the candidate patch
          // plus exact-head workflow evidence. The provider catches storage access
          // failures, validates/replaces IDs, caches one in-memory fallback, and
          // migrates the legacy key. Focused tests exercise every requested storage
          // shape. The exact PR head has a successful Verify workflow whose only
          // verification step executes `npm run verify`; that script runs typecheck,
          // build, every test:* script including test:player-session, and the existing
          // integration tests. PRTruth may remain conservative until it can soundly
          // associate these source/test facts with individual requirements.
          if (report.verdict === 'PROVEN' && results.some((r) => r.status !== 'PROVEN')) {
            throw new Error('A global PROVEN verdict must not hide non-PROVEN requirement rows');
          }
          NODE
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-28
          path: oracle-results/*.json
