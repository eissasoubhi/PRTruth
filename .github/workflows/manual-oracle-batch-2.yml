name: Manual oracle batch 2

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-2.yml"
      - "docs/manual-oracle-corpus.md"
      - "src/**"
      - "test/**"

permissions:
  contents: read
  actions: read
  checks: read

jobs:
  public-oracles:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout PRTruth
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build current PRTruth source
        run: pnpm build

      - name: Run Go and PHP public oracle cases
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p oracle-results

          node dist/cli.js verify \
            --repo Shevanio/shevanio-ai \
            --issue 11 \
            --pr 12 \
            --policy report-only \
            --format json \
            --output oracle-results/shevanio-11-12.json

          node dist/cli.js verify \
            --repo nilesh32236/performance-optimisation \
            --issue 601 \
            --pr 645 \
            --policy report-only \
            --format json \
            --output oracle-results/performance-601-645.json

      - name: Print compact matrix
        run: |
          node --input-type=module <<'NODE'
          import { readdirSync, readFileSync } from 'node:fs';
          for (const file of readdirSync('oracle-results').sort()) {
            const payload = JSON.parse(readFileSync(`oracle-results/${file}`, 'utf8'));
            const report = payload.report ?? payload;
            const req = Object.groupBy(report.results ?? [], (r) => r.status);
            const claims = Object.groupBy(report.claimResults ?? [], (r) => r.status);
            console.log(`${file}: verdict=${report.verdict}`);
            console.log(`  requirements proven=${req.PROVEN?.length ?? 0} failed=${req.FAILED?.length ?? 0} unproven=${req.UNPROVEN?.length ?? 0}`);
            console.log(`  claims proven=${claims.PROVEN?.length ?? 0} failed=${claims.FAILED?.length ?? 0} unproven=${claims.UNPROVEN?.length ?? 0}`);
            for (const result of report.results ?? []) {
              console.log(`  ${result.status.padEnd(8)} ${result.requirement?.text ?? '<missing>'}`);
            }
          }
          NODE

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: prtruth-manual-oracle-batch-2
          path: oracle-results/*.json
          if-no-files-found: warn
