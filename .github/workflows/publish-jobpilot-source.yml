name: Publish JobPilot public source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-jobpilot-source.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    name: Publish clean JobPilot source snapshot
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PUBLISH_TOKEN: ${{ secrets.DEVELOPMENT_COCKPIT_TOKEN }}
      PRIVATE_REPO: eissasoubhi/jobpilot-local
      PRIVATE_REF: ci/public-github-hosted-runners
      PUBLIC_REPO: eissasoubhi/jobpilot
      PUBLIC_BRANCH: source
    steps:
      - name: Validate publishing token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo "::error::DEVELOPMENT_COCKPIT_TOKEN is required."
            exit 1
          fi

      - name: Clone sanitized private snapshot
        shell: bash
        run: |
          set -euo pipefail
          export GIT_TERMINAL_PROMPT=0
          git clone \
            --depth 1 \
            --single-branch \
            --branch "$PRIVATE_REF" \
            "https://x-access-token:${PUBLISH_TOKEN}@github.com/${PRIVATE_REPO}.git" \
            jobpilot-source

      - name: Refuse known personal or credential material
        shell: bash
        run: |
          set -euo pipefail
          cd jobpilot-source

          known_private_pattern='eissa\.soubhi@gmail\.com|33617796780|aissa0soubhi|Aissa[[:space:]]+SOUBHI'
          if grep -RInE --exclude-dir=.git "$known_private_pattern" .; then
            echo "::error::Known personal data is still present in the public snapshot."
            exit 1
          fi

          credential_pattern='github_pat_[A-Za-z0-9_]{20,}|ghp_[A-Za-z0-9]{20,}|AIza[0-9A-Za-z_-]{25,}|BEGIN ([A-Z]+ )?PRIVATE KEY'
          if grep -RInE --exclude-dir=.git "$credential_pattern" .; then
            echo "::error::A credential-like value is present in the public snapshot."
            exit 1
          fi

          while IFS= read -r path; do
            case "$path" in
              ./.env.example|./data/private/README.md) ;;
              *)
                echo "::error::Sensitive-looking tracked file found: $path"
                exit 1
                ;;
            esac
          done < <(find . -type f \( -name '.env' -o -name '.env.*' -o -name '*.pem' -o -name '*.key' -o -name 'credentials.json' \) -print)

      - name: Create clean public history
        shell: bash
        run: |
          set -euo pipefail
          cd jobpilot-source

          # The existing PAT can publish repository contents but GitHub correctly
          # refuses workflow-file changes without the workflow scope. Publish the
          # clean source first; the three reviewed workflow files are installed
          # afterwards through the GitHub integration with Actions write access.
          rm -rf .github/workflows

          rm -rf .git
          git init -b "$PUBLIC_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add --all
          git commit -m "Initial public JobPilot source"
          git remote add public "https://x-access-token:${PUBLISH_TOKEN}@github.com/${PUBLIC_REPO}.git"
          git push --force public "$PUBLIC_BRANCH:$PUBLIC_BRANCH"

      - name: Make public source branch the repository default
        shell: bash
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${PUBLIC_REPO}"
          curl --fail-with-body --silent --show-error \
            --request PATCH \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLISH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "$api" \
            --data "{\"default_branch\":\"${PUBLIC_BRANCH}\"}" \
            >/tmp/jobpilot-repo.json
          test "$(jq -r '.default_branch' /tmp/jobpilot-repo.json)" = "$PUBLIC_BRANCH"

      - name: Verify website branch was preserved
        shell: bash
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer ${PUBLISH_TOKEN}" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${PUBLIC_REPO}/pages" \
            >/tmp/jobpilot-pages.json
          test "$(jq -r '.source.branch' /tmp/jobpilot-pages.json)" = "main"
          echo "JobPilot public source published on ${PUBLIC_REPO}:${PUBLIC_BRANCH}; GitHub Pages remains on main."
