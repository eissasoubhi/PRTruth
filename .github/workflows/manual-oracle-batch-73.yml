name: Manual oracle batch 73

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/manual-oracle-batch-73.yml"
      - "src/**"
      - "test/**"

permissions:
  contents: read

jobs:
  release-image-live-deploy-boundary:
    name: Release image vs live deploy oracle
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.12.0
          package-manager-cache: false

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --prod=false --force

      - name: Build PRTruth
        run: pnpm build

      - name: Run PRTruth against real release-image/deploy oracle
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo genfeedai/genfeed.ai \
            --issue 3876 \
            --pr 3878 \
            --policy report-only \
            --format json \
            --output dogfood-results/genfeed-3878.json

      - name: Compare with independent release-image/live-deploy oracle
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const report = JSON.parse(
            readFileSync('dogfood-results/genfeed-3878.json', 'utf8')
          ).report;

          // Independent inspection of genfeedai/genfeed.ai issue #3876 and merged PR #3878:
          // - the issue has four explicit acceptance criteria;
          // - PR #3878 exact head 51e50ae4605b6a91a83e5792c5b866481541c7ed has broad
          //   successful CI plus a successful `Build Server Image` job;
          // - that PR-head evidence builds the image but does not show workers actually starting
          //   successfully from that release image;
          // - the issue's strongest criterion requires the hosted SaaS deploy and post-deploy smoke
          //   to pass from one exact master SHA, which is necessarily post-merge/live evidence;
          // - PR prose says production remained untouched, so current PR-head CI must not be
          //   promoted into proof of that live deployment lifecycle.

          if (report.results.length !== 4) {
            throw new Error(`Expected exactly 4 authoritative acceptance criteria, received ${report.results.length}.`);
          }

          const startsFromReleaseImage = report.results.find((result) =>
            /module graph starts successfully from the release image/i.test(result.requirement.text)
          );
          if (!startsFromReleaseImage) {
            throw new Error('Expected the release-image startup acceptance criterion.');
          }
          if (startsFromReleaseImage.status === 'PROVEN') {
            throw new Error('Building a server image and passing broad CI must not by itself PROVE that workers start successfully from the release image.');
          }

          const liveDeploy = report.results.find((result) =>
            /hosted SaaS deploy|post-deploy smoke|one exact master SHA/i.test(result.requirement.text)
          );
          if (!liveDeploy) {
            throw new Error('Expected the hosted SaaS deploy/post-deploy smoke acceptance criterion.');
          }
          if (liveDeploy.status === 'PROVEN') {
            throw new Error('PR-head CI must not PROVE a required post-merge hosted SaaS deploy and post-deploy smoke.');
          }

          if (report.verdict === 'PROVEN') {
            throw new Error('Overall verdict must not be PROVEN while live release-image startup/deploy evidence is unobserved on the PR head.');
          }

          console.log(JSON.stringify({
            verdict: report.verdict,
            criteria: report.results.map((result) => ({
              text: result.requirement.text,
              status: result.status,
              reason: result.reason
            })),
            checks: report.checks.map((check) => ({
              name: check.name,
              scope: check.scope,
              status: check.status,
              conclusion: check.conclusion
            }))
          }, null, 2));
          NODE

      - name: Upload dogfood result
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: manual-oracle-batch-73
          path: dogfood-results/genfeed-3878.json
          if-no-files-found: error
