name: Real project dogfood

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1"
  pull_request:
    paths:
      - ".github/workflows/dogfood.yml"

permissions:
  contents: read

jobs:
  verify-public-prs:
    name: verify real public PR histories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      NODE_ENV: development
      NPM_CONFIG_PRODUCTION: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.12.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --prod=false

      - name: Build PRTruth
        run: pnpm build

      - name: Verify ai-saas-factory V0.2
        run: |
          mkdir -p dogfood-results
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo eissasoubhi/ai-saas-factory \
            --issue 1 \
            --pr 3 \
            --policy report-only \
            --format json \
            --output dogfood-results/ai-saas-factory-1-3.json

      - name: Verify MPC baseline CI
        run: |
          env -u GITHUB_TOKEN node dist/cli.js verify \
            --repo eissasoubhi/mpc \
            --issue 5 \
            --pr 8 \
            --policy report-only \
            --format json \
            --output dogfood-results/mpc-5-8.json

      - name: Assert conservative real-world behavior
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';

          const ai = JSON.parse(readFileSync('dogfood-results/ai-saas-factory-1-3.json', 'utf8'));
          const mpc = JSON.parse(readFileSync('dogfood-results/mpc-5-8.json', 'utf8'));

          for (const [name, report] of [['ai-saas-factory', ai], ['mpc', mpc]]) {
            if (!Array.isArray(report.results) || report.results.length === 0) {
              throw new Error(`${name}: expected extracted acceptance criteria`);
            }
            if (!Array.isArray(report.checks) || report.checks.length === 0) {
              throw new Error(`${name}: expected GitHub CI evidence`);
            }
            if (!['PROVEN', 'FAILED', 'NOT_PROVEN'].includes(report.verdict)) {
              throw new Error(`${name}: unexpected verdict ${report.verdict}`);
            }
          }

          const coverageRequirement = ai.results.find((result) =>
            result.requirement?.text === 'Automated tests for core identity/workspace flows'
          );
          if (!coverageRequirement) {
            throw new Error('ai-saas-factory: expected the real test-coverage acceptance criterion');
          }
          if (coverageRequirement.status !== 'UNPROVEN') {
            throw new Error(
              `ai-saas-factory: broad coverage requirement must stay UNPROVEN, got ${coverageRequirement.status}`
            );
          }

          const validationClaim = (ai.claimResults ?? []).find((result) =>
            result.claim?.text?.includes('CI passes install, lint, typecheck, tests and production build')
          );
          if (!validationClaim) {
            throw new Error('ai-saas-factory: expected the prose CI validation claim');
          }

          console.log(`ai-saas-factory verdict: ${ai.verdict}`);
          console.log(`ai-saas-factory CI validation claim: ${validationClaim.status}`);
          console.log(`mpc verdict: ${mpc.verdict}`);
          NODE

      - name: Upload dogfood reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prtruth-real-project-reports
          path: dogfood-results/*.json
          if-no-files-found: warn
