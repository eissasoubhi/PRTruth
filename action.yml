name: PRTruth Verify
description: Verify whether a pull request proves the requirements of a GitHub issue.
author: PRTruth

branding:
  icon: check-circle
  color: purple

inputs:
  issue:
    description: GitHub issue number. Optional when the PR body closes exactly one issue with Fixes/Closes/Resolves #123.
    required: false
    default: ""
  pr:
    description: Pull request number to verify.
    required: true
  repo:
    description: Repository in owner/name form.
    required: false
    default: ${{ github.repository }}
  format:
    description: "Output format: terminal, markdown, json, or badge."
    required: false
    default: markdown
  policy:
    description: "Verification policy: strict, failures-only, or report-only."
    required: false
    default: strict
  comment:
    description: Create or update the PRTruth evidence comment on the pull request.
    required: false
    default: "false"
  github_summary:
    description: Append the Markdown verification report to the GitHub Actions job summary.
    required: false
    default: "true"
  token:
    description: GitHub token used to read issues, pull requests, files, checks, and workflow evidence.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
      with:
        node-version: 22.12.0
        package-manager-cache: false

    - name: Verify pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
        NPM_CONFIG_USERCONFIG: /dev/null
        NPM_CONFIG_REGISTRY: https://registry.npmjs.org
        NPM_CONFIG_IGNORE_SCRIPTS: "true"
        NPM_CONFIG_AUDIT: "false"
        NPM_CONFIG_FUND: "false"
        PRTRUTH_REPO: ${{ inputs.repo }}
        PRTRUTH_ISSUE: ${{ inputs.issue }}
        PRTRUTH_PR: ${{ inputs.pr }}
        PRTRUTH_FORMAT: ${{ inputs.format }}
        PRTRUTH_POLICY: ${{ inputs.policy }}
        PRTRUTH_COMMENT: ${{ inputs.comment }}
        PRTRUTH_GITHUB_SUMMARY: ${{ inputs.github_summary }}
      run: |
        PRTRUTH_VERSION="$(node -p "require(process.env.GITHUB_ACTION_PATH + '/package.json').version")"
        args=(
          verify
          --repo "$PRTRUTH_REPO"
          --pr "$PRTRUTH_PR"
          --format "$PRTRUTH_FORMAT"
          --policy "$PRTRUTH_POLICY"
        )

        if [[ -n "$PRTRUTH_ISSUE" ]]; then
          args+=(--issue "$PRTRUTH_ISSUE")
        fi

        if [[ "$PRTRUTH_GITHUB_SUMMARY" == "true" ]]; then
          args+=(--github-summary)
        fi

        if [[ "$PRTRUTH_COMMENT" == "true" ]]; then
          args+=(--comment)
        fi

        TEMP_DIR="$(mktemp -d)"
        trap 'rm -rf "$TEMP_DIR"' EXIT
        (
          cd "$TEMP_DIR"
          npx -y "prtruth@${PRTRUTH_VERSION}" "${args[@]}"
        )
