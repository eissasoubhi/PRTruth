name: PRTruth Verify
description: Verify whether a pull request proves the requirements of a GitHub issue.
author: PRTruth

branding:
  icon: check-circle
  color: purple

inputs:
  issue:
    description: GitHub issue number containing the requirements.
    required: true
  pr:
    description: Pull request number to verify.
    required: true
  repo:
    description: Repository in owner/name form.
    required: false
    default: ${{ github.repository }}
  format:
    description: Output format: terminal, markdown, or json.
    required: false
    default: markdown
  token:
    description: GitHub token used to read issues, pull requests, files, and checks.
    required: false
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22.12.0

    - name: Build PRTruth
      shell: bash
      working-directory: ${{ github.action_path }}
      run: |
        npm install --ignore-scripts
        npm run build

    - name: Verify pull request
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.token }}
      run: >-
        node "$GITHUB_ACTION_PATH/dist/cli.js" verify
        --repo "${{ inputs.repo }}"
        --issue "${{ inputs.issue }}"
        --pr "${{ inputs.pr }}"
        --format "${{ inputs.format }}"
