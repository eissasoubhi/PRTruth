<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="title desc">
  <title id="title">PRTruth pull request evidence demo</title>
  <desc id="desc">A terminal-style illustration showing PRTruth verifying a generic pull request and keeping stronger claims unproven when observable GitHub evidence is insufficient.</desc>
  <rect width="1200" height="680" rx="28" fill="#0d1117"/>
  <rect x="32" y="32" width="1136" height="616" rx="22" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <circle cx="68" cy="67" r="8" fill="#f85149"/>
  <circle cx="94" cy="67" r="8" fill="#d29922"/>
  <circle cx="120" cy="67" r="8" fill="#3fb950"/>
  <text x="1040" y="74" fill="#a371f7" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">PRTruth</text>

  <text x="72" y="125" fill="#f0f6fc" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">$ npx -y prtruth@latest verify \</text>
  <text x="72" y="165" fill="#f0f6fc" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    --repo owner/repository \</text>
  <text x="72" y="205" fill="#f0f6fc" font-size="24" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">    --pr 456 --policy report-only</text>

  <line x1="72" y1="245" x2="1128" y2="245" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="292" fill="#f0f6fc" font-size="25" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700">Observable evidence, deliberately strict verdicts</text>
  <text x="72" y="330" fill="#8b949e" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">A green test check can prove tests passed without proving every stronger claim.</text>

  <text x="72" y="396" fill="#f0f6fc" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">Tests pass</text>
  <rect x="910" y="366" width="186" height="42" rx="18" fill="none" stroke="#3fb950" stroke-width="2"/>
  <text x="952" y="394" fill="#3fb950" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">PROVEN</text>

  <text x="72" y="468" fill="#f0f6fc" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">“542 tests passed”</text>
  <rect x="910" y="438" width="186" height="42" rx="18" fill="none" stroke="#d29922" stroke-width="2"/>
  <text x="938" y="466" fill="#d29922" font-size="20" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-weight="700">UNPROVEN</text>

  <line x1="72" y1="518" x2="1128" y2="518" stroke="#30363d" stroke-width="2"/>
  <text x="72" y="563" fill="#f0f6fc" font-size="23" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700">Why?</text>
  <text x="142" y="563" fill="#8b949e" font-size="21" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">A successful test check does not prove an exact count the evidence never exposes.</text>
  <text x="72" y="608" fill="#a371f7" font-size="22" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700">PRTruth prefers UNPROVEN over invented certainty.</text>
</svg>
